<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Todd — Minimal AI chatbot icon</title>
  <desc id="desc">Minimal rounded robot face with antenna, dot eyes, and a small smile.</desc>

  <style>
    :root {
      --todd-bg: #FFFFFF;
      --todd-line: #0F2747;
      --todd-accent: #4DA3FF;
    }

    .outline {
      fill: none;
      stroke: var(--todd-line);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- Antenna -->
  <path d="M32 17V10" class="outline"/>
  <circle cx="32" cy="7" r="3.5" fill="var(--todd-bg)" stroke="var(--todd-line)" stroke-width="3.2"/>

  <!-- Side ears -->
  <path d="M10 29H7.5A3.5 3.5 0 0 0 4 32.5v4A3.5 3.5 0 0 0 7.5 40H10" class="outline"/>
  <path d="M54 29h2.5a3.5 3.5 0 0 1 3.5 3.5v4a3.5 3.5 0 0 1-3.5 3.5H54" class="outline"/>

  <!-- Head -->
  <rect x="10" y="17" width="44" height="36" rx="11" fill="var(--todd-bg)" stroke="var(--todd-line)" stroke-width="3.2"/>

  <!-- Face -->
  <circle cx="24" cy="33" r="2.8" fill="var(--todd-line)"/>
  <circle cx="40" cy="33" r="2.8" fill="var(--todd-line)"/>
  <path d="M25.5 41c1.8 2.2 3.9 3.2 6.5 3.2s4.7-1 6.5-3.2" class="outline"/>
</svg>
