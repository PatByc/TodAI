<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Todai Classic Check App Icon</title>
  <desc id="desc">A rounded square app icon with a checklist. The first row has a checked blue box and the word Todai. Two lighter rows appear below.</desc>

  <style>
    :root {
      --bg-page: #F4F7FB;
      --bg-tile: #F8FBFF;
      --shadow: rgba(26, 51, 88, 0.10);

      --brand-blue: #1E7BFF;
      --brand-blue-dark: #0B2A66;

      --line-soft: #C9D5E8;
      --line-mid: #B9C8DE;

      --white: #FFFFFF;
    }

    .soft-shadow { filter: url(#shadow); }
    .label {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: var(--brand-blue-dark);
      letter-spacing: -0.02em;
    }
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1A3358" flood-opacity="0.10"/>
    </filter>

    <linearGradient id="tileGrad" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FBFDFF"/>
      <stop offset="100%" stop-color="#EEF4FC"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D8CFF"/>
      <stop offset="100%" stop-color="#1568F4"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5D2E6"/>
      <stop offset="100%" stop-color="#D7E1EE"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect x="0" y="0" width="1024" height="1024" fill="var(--bg-page)"/>

  <!-- Main tile -->
  <rect x="116" y="116" width="792" height="792" rx="132" fill="url(#tileGrad)" class="soft-shadow"/>

  <!-- Row 1 checked box -->
  <rect x="260" y="312" width="156" height="156" rx="42" fill="url(#blueGrad)" class="soft-shadow"/>

  <!-- Check mark -->
  <path d="M301 390 L340 429 L376 351"
        fill="none"
        stroke="var(--white)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Todai word -->
  <text x="468" y="428" class="label" font-size="116">Todai</text>

  <!-- Row 2 empty checkbox -->
  <rect x="282" y="530" width="112" height="112" rx="28"
        fill="none"
        stroke="var(--line-mid)"
        stroke-width="18"/>

  <!-- Row 2 line -->
  <rect x="498" y="555" width="344" height="48" rx="24" fill="url(#lineGrad)"/>

  <!-- Row 3 empty checkbox -->
  <rect x="282" y="690" width="112" height="112" rx="28"
        fill="none"
        stroke="var(--line-mid)"
        stroke-width="18"/>

  <!-- Row 3 line -->
  <rect x="498" y="715" width="344" height="48" rx="24" fill="url(#lineGrad)"/>
</svg>
