<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Todai Classic Check App Icon</title>
  <desc id="desc">A graphite rounded-square app icon with a neon-green checked box, the word TodAI, and two subtle checklist rows.</desc>

  <style>
    :root {
      --tile-edge: #353B40;
      --signal: #B8FF62;
      --signal-ink: #101510;
      --label: #E9ECEA;
      --line-mid: #626A70;
    }

    .soft-shadow { filter: url(#shadow); }
    .label {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: var(--label);
      letter-spacing: -0.02em;
    }
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <linearGradient id="tileGrad" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#25292D"/>
      <stop offset="100%" stop-color="#17191C"/>
    </linearGradient>

    <linearGradient id="signalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7FF7F"/>
      <stop offset="100%" stop-color="#9EEA49"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#697177"/>
      <stop offset="100%" stop-color="#454C51"/>
    </linearGradient>
  </defs>

  <!-- Main tile -->
  <rect x="116" y="116" width="792" height="792" rx="132" fill="url(#tileGrad)" stroke="var(--tile-edge)" stroke-width="12" class="soft-shadow"/>

  <!-- Row 1 checked box -->
  <rect x="260" y="312" width="156" height="156" rx="42" fill="url(#signalGrad)"/>

  <!-- Check mark -->
  <path d="M301 390 L340 429 L376 351"
        fill="none"
        stroke="var(--signal-ink)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Todai word -->
  <text x="468" y="428" class="label" font-size="116">TodAI</text>

  <!-- Row 2 empty checkbox -->
  <rect x="282" y="530" width="112" height="112" rx="28"
        fill="none"
        stroke="var(--line-mid)"
        stroke-width="18"/>

  <!-- Row 2 line -->
  <rect x="498" y="555" width="344" height="48" rx="24" fill="url(#lineGrad)"/>

  <!-- Row 3 empty checkbox -->
  <rect x="282" y="690" width="112" height="112" rx="28"
        fill="none"
        stroke="var(--line-mid)"
        stroke-width="18"/>

  <!-- Row 3 line -->
  <rect x="498" y="715" width="344" height="48" rx="24" fill="url(#lineGrad)"/>
</svg>
