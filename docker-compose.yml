services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: todai
      POSTGRES_PASSWORD: todai_dev
      POSTGRES_DB: todai
    volumes:
      - todai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  todai_pgdata:
